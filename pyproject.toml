[project]
name = "jev-navigator"
version = "0.1.0"
description = "Find code with small, typed Jev judgments: code offers the places, Jev judges each one"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "André Machon" }]
license = "MIT"
dependencies = [
    "msgspec>=0.22",
]

[project.scripts]
jvn = "jev_navigator.cli:main"

[project.optional-dependencies]
typesafe = ["typesafe-sdk"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
